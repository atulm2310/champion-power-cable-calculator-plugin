<div class="item-original segments-item">
    <h2 class="accordion-header" id="heading{seg_number}">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" aria-expanded="true">
            Seg {seg_number}
        </button>
    </h2>
    <div id="collapse{seg_number}" class="accordion-collapse collapse" aria-labelledby="heading{seg_number}"
        data-bs-parent="#accordionExample">
        <div class="accordion-body">
            <div class="form-group ">
                <label for="" class="subtitle">Straight Section</label>
                <label for="segment-build-list-note">Segment Note</label>
                <input type="text" class="form-control  formField" name="segment-build-list-note"
                    aria-label="segment-build-list-note" >
                <input type="hidden" name="segment-build-list-segment formField" value="{seg_number}">
            </div>
            <div class="form-group">
                <label for="segment-build-list-slope">Slope (Deg)</label>
                <input type="number" class="form-control  formField" name="segment-build-list-slope"
                    aria-label="segment-build-list-slope" >
            </div>
            <div class="form-group">
                <label for="segment-build-list-slope-direction">Slope Direction</label>
                 <select class="form-control required formField" name="segment-build-list-slope-direction"
                    aria-label="segment-build-list-slope-direction">
                    <option value="">Select an option</option>
                    <option value="Horizontal">Horizontal</option>
                    <option value="Up">Up</option>
                    <option value="Down">Down</option>
                </select>
            </div>
            <div class="form-group">
                <label for="segment-build-list-length">Length (ft)</label>
                <input type="number" class="form-control required formField" name="segment-build-list-length"
                    aria-label="segment-build-list-length" >
            </div>

            <div class="form-group ">
                <label for="" class="subtitle">Bend Section</label>
                <label for="segment-build-list-type">Type</label>
                <select class="form-control required formField" name="segment-build-list-type"
                    aria-label="segment-build-list-type">
                    <option value="">Select an option</option>
                    <option value="Horizontal">Horizontal</option>
                    <option value="Up">Up</option>
                    <option value="Down">Down</option>
                    <option value="Vert. Up">Vert. Up</option>
                    <option value="Vert. Dn">Vert. Dn</option>
                    <option value="Call CFI">Call CFI</option>
                </select>
            </div>
            <div class="form-group ">
                <label for="segment-build-list-direction">Direction</label>
                <input type="text" class="form-control required formField" name="segment-build-list-direction"
                    aria-label="segment-build-list-direction" >
            </div>
            <div class="form-group ">
                <label for="segment-build-list-elbow-angle">Elbow Angle (Deg)</label>
                <select class="form-control required formField open_option" name="segment-build-list-elbow-angle"
                    aria-label="segment-build-list-elbow-angle">
                    <option value="">Select an option</option>
                    <option value=""></option>
                    <option value="0">0</option>
                    <option value="90">90</option>
                    <option value="60">60</option>
                    <option value="45">45</option>
                    <option value="30">30</option>
                    <option value="22.5">22.5</option>
                    <option value="11.25">11.25</option>
                </select>
            </div>
            <div class="form-group ">
                <label for="segment-build-list-elbow-radius">Elbow Radius (in)</label>
                <select class="form-control required formField open_option" name="segment-build-list-elbow-radius"
                    aria-label="segment-build-list-elbow-radius">
                    <option value="">Select an option</option>
                    <option value=""></option>
                    <option value="0">0</option>
                    <option value="12">12</option>
                    <option value="24">24</option>
                    <option value="36">36</option>
                    <option value="48">48</option>
                    <option value="60">60</option>
                    <option value="72">72</option>
                    <option value="84">84</option>
                    <option value="96">96</option>
                    <option value="108">108</option>
                </select>
            </div>

            <div class="form-group ">
                <label for="" class="subtitle">Continuous</label>
                <label for="segment-build-list-tension">Tension (lbs)</label>
                <input type="number" class="form-control required" formField name="segment-build-list-tension"
                    aria-label="segment-build-list-tension" >
            </div>
            <div class="form-group ">
                <label for="segment-build-list-SWBP">SWBP (lbs/ft)</label>
                <input type="number" class="form-control required formField" name="segment-build-list-SWBP"
                    aria-label="segment-build-list-SWBP" >
            </div>
            <div class="form-group ">
                <label for="segment-build-list-begin-segment">Begin New Pull in this Segment</label>
                <select class="form-control userFill formField" name="segment-build-list-begin-segment"
                    aria-label="segment-build-list-begin-segment">
                    <option value="">No</option> 
                    <option value="Yes">Yes</option>
                </select>
            </div>
        </div>
    </div>
</div>
